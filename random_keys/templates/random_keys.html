<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <title>Random Keys Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 30px;
        }

        .main-wrapper {
            max-width: calc(4 * 200px + 3 * 15px);
            margin: 0 auto;
        }

        .header-form-wrapper {
            max-width: calc(4 * 200px + 3 * 15px);
            margin: 0;
        }

        #generator-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .header-form-wrapper h1 {
            margin-bottom: 15px;
        }

        #bars {
            height: 50px;
            width: 200px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
            border: 2px solid #dee2e6;
            font-size: 1.1rem;
        }

        .generate-btn {
            background-color: #0d6efd;
            border: none;
            border-radius: 12px;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
            height: 50px;
            width: 200px;
            font-size: 1.1rem;
        }

        .generate-btn:hover {
            background-color: #0b5ed7;
        }

        .tiles-wrapper {
            max-width: calc(4 * 200px + 3 * 15px);
            margin: 0 auto;
        }

        #tiles-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            justify-items: center;
        }

        .tile {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 200px;
        }
        .metronome-container {
            margin-top: 20px;
            margin-bottom: 30px; /* Adds space below the metronome */
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-width: 400px; /* Makes the container narrower */
        }

        .metronome-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bpm-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #beat-indicator {
            width: 25px;
            height: 25px;
            /* margin-top removed as flexbox handles alignment */
            border-radius: 50%;
            background-color: #6c757d; /* Bootstrap secondary color */
            transition: background-color 0.05s ease-in-out;
        }

        #beat-indicator.active {
            background-color: #dc3545; /* Bootstrap danger color */
        }
    </style>
</head>

<body class="p-4">
<div class="main-wrapper mx-auto">
    <div class="header-form-wrapper">
        <h1>Random Keys Generator</h1>
        {% include 'components/metronome.html' %}
        <form id="generator-form">
            <input type="number" class="form-control form-control-sm" id="bars" name="bars" min="1" max="24"
                   required placeholder="Number of bars"/>
        </form>
        <div class="buttons-container">
            <button type="submit" form="generator-form" class="btn btn-primary generate-btn">
                Generate!
            </button>
            <button onclick="window.location.href='/'" class="btn btn-secondary generate-btn">Go to Main Page</button>
        </div>
        <div class="tiles-wrapper">
            <div id="tiles-container"></div>
        </div>

    </div>
</div>

<script src="/random_keys/static/random_keys.js"></script>
<script src="{{ url_for('static', path='/js/metronome.js') }}"></script>


</body>

</html>
